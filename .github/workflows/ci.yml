name: UniOne Go CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install dependencies
        run: go mod download
        working-directory: unione_go

      - name: Build
        run: go build -v ./...
        working-directory: unione_go

      - name: Test
        run: go test -v ./...
        working-directory: unione_go
